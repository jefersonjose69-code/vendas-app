name: Criar projeto Flutter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      - name: Criar projeto Flutter
        run: flutter create --project-name sistema_vendas .

      - name: Salvar projeto no GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Criar projeto Flutter"
          git push origin HEAD:${GITHUB_REF_NAME}
