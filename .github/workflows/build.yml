name: Construir aplicativo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      - name: Criar projeto Flutter
        run: flutter create .

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar arquivo do projeto
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Criar base do aplicativo"
          git push
