name: Construir aplicativo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      - name: Criar projeto Flutter
        run: flutter create --project-name sistema_vendas .

      - name: Instalar dependências
        run: flutter pub get

      - name: Testar projeto
        run: flutter analyze
