name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar iOS
        run: flutter build ios --release --no-codesign

      - name: Compactar aplicativo
        run: |
          cd build/ios/iphoneos
          zip -r Runner-ios.zip Runner.app

      - name: Salvar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: build/ios/iphoneos/Runner-ios.zip
