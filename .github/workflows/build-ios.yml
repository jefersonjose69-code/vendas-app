name: Gerar iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar projeto iOS
        run: flutter build ios --release --no-codesign

      - name: Compactar aplicativo
        run: |
          cd build/ios/iphoneos
          zip -r sistema-vendas-ios.zip Runner.app

      - name: Salvar aplicativo iOS
        uses: actions/upload-artifact@v4
        with:
          name: sistema-vendas-ios
          path: build/ios/iphoneos/sistema-vendas-ios.zip
